# Quick start:
#   docker compose up -d
# Then open http://localhost:8080/admin and add your shared album URLs.
#
# Optional: seed albums on first start
#   GPSS_URLS="https://photos.google.com/share/...?key=...,https://..." docker compose up -d

services:
  slideshow:
    build: .
    image: google-photos-slideshow:latest
    container_name: google-photos-slideshow
    restart: unless-stopped
    ports:
      - "8095:8080"   # HTTP (slideshow + admin)
      - "6789:6789"   # WebSocket (live controls)
    volumes:
      # Persist album list / config across restarts
      - gpss-config:/config
    environment:
      GPSS_PORT: "8080"
      GPSS_WEBSOCKET_PORT: "6789"
      GPSS_CONFIG: /config/config.yaml
      GPSS_NO_BROWSER: "1"
      # Uncomment and set to seed albums on first launch:
      # GPSS_URLS: "https://photos.google.com/share/ALBUM1?key=...,https://photos.google.com/share/ALBUM2?key=..."
      # GPSS_TITLE: "Family Slideshow"
      # GPSS_IMAGE_DURATION: "5"
    # Optional resource limits
    # mem_limit: 256m

volumes:
  gpss-config:
